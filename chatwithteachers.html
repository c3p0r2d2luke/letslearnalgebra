<html lang="en">
<head>

<meta charset="utf-8">
<title>Chat With Teachers</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  /* ===============================
   DISCORD-STYLE THEME (DROP-IN)
   =============================== */

:root {
  --bg-main: #2b2d31;
  --bg-secondary: #1e1f22;
  --bg-tertiary: #313338;
  --bg-hover: #35373c;

  --text-main: #dbdee1;
  --text-muted: #949ba4;
  --text-link: #00a8fc;

  --accent: #5865f2;
  --danger: #ed4245;
  --success: #3ba55d;
}

/* Reset-ish */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg-main);
  color: var(--text-main);
  font-family: "gg sans", system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Arial, sans-serif;
}

/* App container */
.chat-app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ===============================
   MESSAGE LIST
   =============================== */

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px 0;
  list-style: none;
  margin: 0;
}

/* Individual message row */
#messages li {
  display: flex;
  flex-direction: column;
  padding: 6px 16px;
  gap: 2px;
  position: relative;
}

#messages li:hover {
  background: var(--bg-hover);
}

/* Role colors */
#messages li.admin .username {
  color: var(--accent);
}

#messages li.manager .username {
  color: var(--success);
}

/* Username + timestamp row */
.username {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-main);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

/* Message text */
.content {
  font-size: 0.95rem;
  line-height: 1.4;
  color: var(--text-main);
  white-space: pre-wrap;
  word-break: break-word;
}

/* Highlighted / pinned */
li.highlighted {
  background: #404249 !important;
}

li[data-pinned="true"] {
  border-left: 4px solid var(--accent);
}

/* ===============================
   LINK EMBEDS (DISCORD-LIKE)
   =============================== */

.link-preview {
  display: flex;
  gap: 12px;
  background: var(--bg-secondary);
  border-left: 4px solid var(--accent);
  padding: 10px;
  border-radius: 6px;
  margin-top: 6px;
  max-width: 520px;
}

.link-preview img {
  width: 80px;
  height: 80px;
  border-radius: 6px;
  object-fit: cover;
}

.lp-text {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.lp-title {
  font-weight: 600;
  color: #fff;
}

.lp-desc {
  font-size: 0.85rem;
  color: var(--text-muted);
}

.link-preview a {
  color: var(--text-link);
  font-size: 0.85rem;
  text-decoration: none;
}

/* ===============================
   INPUT BAR (BOTTOM)
   =============================== */

#controls {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: var(--bg-tertiary);
  border-top: 1px solid var(--bg-secondary);
}

#messageInput {
  flex: 1;
  background: var(--bg-secondary);
  border: none;
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text-main);
  font-size: 0.95rem;
  resize: none;
  min-height: 44px;
}

#messageInput::placeholder {
  color: var(--text-muted);
}

#messageInput:focus {
  outline: none;
}

#sendButton {
  display: none; /* Discord-style: Enter to send */
}

/* ===============================
   ADMIN / MANAGER MENUS
   =============================== */

.adminControls,
.managerControls {
  display: none;
  position: absolute;
  background: var(--bg-secondary);
  border-radius: 6px;
  padding: 6px;
  top: 24px;
  right: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
  z-index: 100;
  gap: 4px;
  flex-wrap: wrap;
}

.adminControls button,
.managerControls button {
  background: transparent;
  border: none;
  color: var(--text-main);
  font-size: 0.85rem;
  padding: 6px 8px;
  border-radius: 4px;
  cursor: pointer;
}

.adminControls button:hover,
.managerControls button:hover {
  background: var(--bg-hover);
}

/* ===============================
   LOG BOX (ADMIN ONLY)
   =============================== */

#logBox {
  background: #0f0f10;
  color: #00ff88;
  font-family: monospace;
  font-size: 12px;
  padding: 8px;
  height: 160px;
  overflow-y: auto;
  border-top: 1px solid var(--bg-secondary);
}

/* ===============================
   NAME PROMPT
   =============================== */

#namePrompt {
  padding: 12px;
}

#namePrompt input {
  background: var(--bg-secondary);
  border: none;
  border-radius: 6px;
  padding: 8px;
  color: var(--text-main);
}

#namePrompt button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
}
.role-badge {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 4px;
  margin-left: 6px;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.admin-badge {
  background: #ff4d4f;
  color: white;
}

.manager-badge {
  background: #3ba55d;
  color: white;
}
.reactionBubble{
background:#2f3136;
border-radius:12px;
padding:2px 6px;
margin-right:4px;
cursor:pointer;
}

.hoverControls button{
background:#2f3136;
border:none;
color:white;
margin-left:4px;
cursor:pointer;
}

/* ===============================
   TABS
   =============================== */

.tab-container {
  display: flex;
  gap: 0;
  padding: 0;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--bg-tertiary);
}

.tab {
  flex: 1;
  padding: 12px;
  text-align: center;
  cursor: pointer;
  color: var(--text-muted);
  font-weight: 600;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}

.tab:hover {
  color: var(--text-main);
  background: var(--bg-hover);
}

.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  background: transparent;
}

.tabs-content {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.tab-pane {
  display: none;
  flex: 1;
  overflow-y: auto;
  padding: 12px 0;
}

.tab-pane.active {
  display: flex;
  flex-direction: column;
}

#messages {
  list-style: none;
  margin: 0;
  padding: 0;
}

/* Thread styling */
.thread-item {
  padding: 12px 16px;
  margin: 8px 0;
  background: var(--bg-secondary);
  border-radius: 6px;
  border-left: 3px solid var(--accent);
}

.thread-header {
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--text-main);
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.thread-reply-count {
  font-size: 0.8rem;
  color: var(--text-muted);
  background: var(--bg-tertiary);
  padding: 2px 8px;
  border-radius: 4px;
}

.thread-replies {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-left: 12px;
  border-left: 1px solid var(--bg-tertiary);
  margin-top: 8px;
}

.thread-reply {
  font-size: 0.9rem;
  padding: 8px;
  background: var(--bg-tertiary);
  border-radius: 4px;
}

.reply-author {
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 4px;
}

.reactionBar {
  display: flex;
  gap: 4px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.replyPreview {
  font-size: 0.85rem;
  color: var(--text-muted);
  border-left: 2px solid var(--accent);
  padding-left: 8px;
  margin-bottom: 6px;
  font-style: italic;
  display: none;
}

.replyContext {
  position: absolute;
  top: 6px;
  right: 16px;
  background: var(--bg-secondary);
  border: 1px solid var(--bg-tertiary);
  border-radius: 4px;
  padding: 6px 8px;
  font-size: 0.75rem;
  color: var(--text-muted);
  max-width: 180px;
  display: flex;
  align-items: flex-start;
  gap: 6px;
}

.replyContext::before {
  content: "↖";
  color: var(--accent);
  font-weight: bold;
  flex-shrink: 0;
  margin-top: -2px;
}

.replyContextContent {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}

.replyContextAuthor {
  color: var(--accent);
  font-weight: 600;
  display: block;
  margin-bottom: 2px;
}
</style>
</head>
<body>
<h1 style="margin:12px 16px;">Chat Room</h1>

<div id="namePrompt">
  <input id="nameInput" placeholder="Enter your real name, or you will be banned..." />
  <button id="saveNameButton">Save Name</button>
</div>

<div class="chat-app">
  <div class="tab-container">
    <div class="tab active" data-tab="messages">Messages</div>
    <div class="tab" data-tab="threads">Threads</div>
  </div>

  <div class="tabs-content">
    <div class="tab-pane active" id="messages-pane">
      <ul id="messages"></ul>
    </div>
    <div class="tab-pane" id="threads-pane">
      <div id="threadsContainer"></div>
    </div>
  </div>

  <div id="controls">
    <input type="file" id="fileUpload" style="display:none">
<button id="uploadBtn">Upload</button>
    <textarea id="messageInput" placeholder="Message #general" disabled></textarea>
    <button id="sendButton" disabled>Send</button>
  </div>
</div>

<div id="logBox"></div>

<script src="./script.js"></script>
<div id="adminMenu" style="
  display:none;
  position:fixed;
  background:#2f3136;
  border:1px solid #444;
  padding:4px;
  border-radius:6px;
  z-index:9999;
  min-width:140px;
"></div>
<div id="typingIndicator"></div>
</body>
</html>
