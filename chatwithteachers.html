<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat With Teachers</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>

<!-- AUTH GATE -->
<div id="authGate">
  <div id="authBox">

    <!-- Sign In View -->
    <div id="signInView">
      <h2>Welcome Back</h2>
      <input id="signInEmail" type="email" placeholder="Email" autocomplete="email" />
      <input id="signInPassword" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="signInBtn">Sign In</button>
      <p class="auth-error" id="signInError" style="display:none;"></p>
      <p class="auth-switch">Don't have an account? <a href="#" id="toSignUp">Create one</a></p>
    </div>

    <!-- Sign Up View -->
    <div id="signUpView" style="display:none;">
      <h2>Create Account</h2>
      <input id="signUpUsername" type="text" placeholder="Username" autocomplete="username" />
      <input id="signUpEmail" type="email" placeholder="Email" autocomplete="email" />
      <input id="signUpPassword" type="password" placeholder="Password" autocomplete="new-password" />
      <button id="signUpBtn">Sign Up</button>
      <p class="auth-error" id="signUpError" style="display:none;"></p>
      <p class="auth-switch">Already have an account? <a href="#" id="toSignIn">Sign In</a></p>
    </div>

  </div>
</div>

<!-- APP -->
<div id="appContent" style="display:none;">

  <div id="namePrompt">
    <input id="nameInput" placeholder="Enter your name..." />
    <button id="saveNameButton">Save</button>
  </div>

  <!-- MAIN LAYOUT -->
  <div class="app-layout">

    <!-- SERVERS -->
    <div class="server-sidebar">
      <div class="server-icon active">L</div>
      <div class="divider"></div>
    <div class="server-icon" id="addServerBtn">+</div>
    </div>

    <!-- CHANNELS -->
    <div class="channel-sidebar">
      <div class="channel-header">
        <span>Server</span>
    <button id="createChannelBtn" style="display:none;">+</button>
      </div>
      <div id="channelList"></div>
    </div>

    <!-- CHAT -->
    <div class="chat-app">

      <div id="typingIndicator"></div>

      <div class="chat-header">
        <span id="currentChannelName"># general</span>
      </div>

      <ul id="messages"></ul>

      <button id="scrollBottomBtn" title="Jump to latest">↓</button>

      <div id="replyBanner" style="display:none;">
        <span id="replyBannerText"></span>
        <button id="cancelReplyBtn">✕</button>
      </div>

      <div id="controls">
<input type="file" id="fileInput" style="display:none;" />
<button id="uploadBtn">📎</button>
        <textarea id="messageInput" placeholder="Message..." disabled></textarea>
  <button id="sendButton">Send</button>
</div>
    </div>

  </div>

</div>
<!-- MESSAGE RIGHT-CLICK CONTEXT MENU -->
<div id="adminMenu" style="display:none; position:fixed; background:#2f3136; border:1px solid #444; padding:4px; z-index:9999; min-width:200px;"></div>

<!-- CHANNEL RIGHT-CLICK CONTEXT MENU (admin only) -->
<div id="channelMenu" style="display:none; position:fixed; background:#2f3136; border:1px solid #444; padding:4px; z-index:9999; min-width:160px; border-radius:4px; box-shadow:0 8px 24px rgba(0,0,0,0.8);"></div>

<!-- EMOJI PICKER (built dynamically by script.js) -->
<div id="emojiPicker" style="display:none;"></div>

<div id="categoryMenu" style="
  display:none;
  position:fixed;
  background:#2f3136;
  border:1px solid #444;
  padding:6px;
  z-index:9999;
  border-radius:6px;
  min-width:160px;
"></div>

<script src="./script.js" defer></script>
</body>
</html>
