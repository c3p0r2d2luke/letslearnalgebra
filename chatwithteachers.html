<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat With Teachers</title>

  <link rel="stylesheet" href="styles.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>
<body>

<!-- PASSWORD -->
<div id="passwordGate">
  <h2>Enter Password</h2>
  <input id="passwordInput" type="password" placeholder="Password" />
  <button id="passwordBtn">Enter</button>
</div>

<!-- APP -->
<div id="appContent" style="display:none;">

  <div id="namePrompt">
    <input id="nameInput" placeholder="Enter your name..." />
    <button id="saveNameButton">Save</button>
  </div>

  <!-- MAIN LAYOUT -->
  <div class="app-layout">

    <!-- SERVERS -->
    <div class="server-sidebar">
      <div class="server-icon active">L</div>
      <div class="divider"></div>
      <div class="server-icon">+</div>
    </div>

    <!-- CHANNELS -->
    <div class="channel-sidebar">
      <div class="channel-header">
        <span>Server</span>
<button id="createChannelBtn" onclick="tryCreateChannel()">+</button>
      </div>
      <div id="channelList"></div>
    </div>

    <!-- CHAT -->
    <div class="chat-app">

      <div class="chat-header">
        <span id="currentChannelName"># general</span>
      </div>

      <ul id="messages"></ul>

      <div id="controls">
  <button id="uploadBtn">📎</button>
  <textarea id="messageInput" placeholder="Message..." disabled></textarea>
  <button id="sendButton">Send</button>
</div>

    </div>

  </div>
  <div id="logBox"></div>
  <div id="typingIndicator"></div>

</div>
<!-- RIGHT-CLICK CONTEXT MENU -->
<div id="adminMenu" style="display:none; position:fixed; background:#2f3136; border:1px solid #444; padding:4px; z-index:9999; min-width:200px;"></div>

<!-- EMOJI PICKER -->
<div id="emojiPicker" style="display:none; position:fixed; background:#2f3136; border:1px solid #444; padding:8px; z-index:9999; border-radius:8px;">
  <div style="display:flex; flex-wrap:wrap; gap:4px;">
    <button class="emoji-option" style="background:none; border:none; font-size:20px; cursor:pointer; padding:4px;">😀</button>
    <button class="emoji-option" style="background:none; border:none; font-size:20px; cursor:pointer; padding:4px;">😂</button>
    <button class="emoji-option" style="background:none; border:none; font-size:20px; cursor:pointer; padding:4px;">😍</button>
    <button class="emoji-option" style="background:none; border:none; font-size:20px; cursor:pointer; padding:4px;">😎</button>
    <button class="emoji-option" style="background:none; border:none; font-size:20px; cursor:pointer; padding:4px;">😢</button>
    <button class="emoji-option" style="background:none; border:none; font-size:20px; cursor:pointer; padding:4px;">😡</button>
    <button class="emoji-option" style="background:none; border:none; font-size:20px; cursor:pointer; padding:4px;">👍</button>
    <button class="emoji-option" style="background:none; border:none; font-size:20px; cursor:pointer; padding:4px;">👎</button>
    <button class="emoji-option" style="background:none; border:none; font-size:20px; cursor:pointer; padding:4px;">❤️</button>
    <button class="emoji-option" style="background:none; border:none; font-size:20px; cursor:pointer; padding:4px;">🎉</button>
  </div>
</div>
<script src="./script.js" defer></script>
</body>
</html>
