<!DOCTYPE html>
<html lang="en">
<head>
<script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
</script>
<script type="text/javascript">
   (function(){
      emailjs.init({
        publicKey: "nohRtKASS4R_i2HtZ",
      });
   })();
</script>
<meta charset="utf-8">
<title>Chat With Teachers</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  /* ===============================
   DISCORD-STYLE THEME (DROP-IN)
   =============================== */

:root {
  --bg-main: #2b2d31;
  --bg-secondary: #1e1f22;
  --bg-tertiary: #313338;
  --bg-hover: #35373c;

  --text-main: #dbdee1;
  --text-muted: #949ba4;
  --text-link: #00a8fc;

  --accent: #5865f2;
  --danger: #ed4245;
  --success: #3ba55d;
}

/* Reset-ish */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg-main);
  color: var(--text-main);
  font-family: "gg sans", system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", Roboto, Arial, sans-serif;
}

/* App container */
.chat-app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ===============================
   MESSAGE LIST
   =============================== */

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px 0;
  list-style: none;
  margin: 0;
}

/* Individual message row */
#messages li {
  display: flex;
  flex-direction: column;
  padding: 6px 16px;
  gap: 2px;
  position: relative;
}

#messages li:hover {
  background: var(--bg-hover);
}

/* Role colors */
#messages li.admin .username {
  color: var(--accent);
}

#messages li.manager .username {
  color: var(--success);
}

/* Username + timestamp row */
.username {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text-main);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

/* Message text */
.content {
  font-size: 0.95rem;
  line-height: 1.4;
  color: var(--text-main);
  white-space: pre-wrap;
  word-break: break-word;
}

/* Highlighted / pinned */
li.highlighted {
  background: #404249 !important;
}

li[data-pinned="true"] {
  border-left: 4px solid var(--accent);
}

/* ===============================
   LINK EMBEDS (DISCORD-LIKE)
   =============================== */

.link-preview {
  display: flex;
  gap: 12px;
  background: var(--bg-secondary);
  border-left: 4px solid var(--accent);
  padding: 10px;
  border-radius: 6px;
  margin-top: 6px;
  max-width: 520px;
}

.link-preview img {
  width: 80px;
  height: 80px;
  border-radius: 6px;
  object-fit: cover;
}

.lp-text {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.lp-title {
  font-weight: 600;
  color: #fff;
}

.lp-desc {
  font-size: 0.85rem;
  color: var(--text-muted);
}

.link-preview a {
  color: var(--text-link);
  font-size: 0.85rem;
  text-decoration: none;
}

/* ===============================
   INPUT BAR (BOTTOM)
   =============================== */

#controls {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: var(--bg-tertiary);
  border-top: 1px solid var(--bg-secondary);
}

#messageInput {
  flex: 1;
  background: var(--bg-secondary);
  border: none;
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text-main);
  font-size: 0.95rem;
  resize: none;
  min-height: 44px;
}

#messageInput::placeholder {
  color: var(--text-muted);
}

#messageInput:focus {
  outline: none;
}

#sendButton {
  display: none; /* Discord-style: Enter to send */
}

/* ===============================
   ADMIN / MANAGER MENUS
   =============================== */

.adminControls,
.managerControls {
  display: none;
  position: absolute;
  background: var(--bg-secondary);
  border-radius: 6px;
  padding: 6px;
  top: 24px;
  right: 16px;
  box-shadow: 0 8px 24px rgba(0,0,0,.4);
  z-index: 100;
  gap: 4px;
  flex-wrap: wrap;
}

.adminControls button,
.managerControls button {
  background: transparent;
  border: none;
  color: var(--text-main);
  font-size: 0.85rem;
  padding: 6px 8px;
  border-radius: 4px;
  cursor: pointer;
}

.adminControls button:hover,
.managerControls button:hover {
  background: var(--bg-hover);
}

/* ===============================
   LOG BOX (ADMIN ONLY)
   =============================== */

#logBox {
  background: #0f0f10;
  color: #00ff88;
  font-family: monospace;
  font-size: 12px;
  padding: 8px;
  height: 160px;
  overflow-y: auto;
  border-top: 1px solid var(--bg-secondary);
}

/* ===============================
   NAME PROMPT
   =============================== */

#namePrompt {
  padding: 12px;
}

#namePrompt input {
  background: var(--bg-secondary);
  border: none;
  border-radius: 6px;
  padding: 8px;
  color: var(--text-main);
}

#namePrompt button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>
<body>
<h1 style="margin:12px 16px;">Chat Room</h1>

<div id="namePrompt">
  <input id="nameInput" placeholder="Enter your real name, or you will be banned..." />
  <button id="saveNameButton">Save Name</button>
</div>

<div class="chat-app">
  <ul id="messages"></ul>

  <div id="controls">
    <textarea id="messageInput" placeholder="Message #general" disabled></textarea>
    <button id="sendButton" disabled>Send</button>
  </div>
</div>

<div id="logBox"></div>

<script src="./script.js"></script>
</body>
</html>
