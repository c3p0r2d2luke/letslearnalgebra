<!DOCTYPE html>
<html lang="en">
<head>

<script>
window.addEventListener("beforeunload", function (event) {
  event.preventDefault();
  event.returnValue = "";
});
</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Portal</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
}

#topbar{
    padding:10px;
    background:#1b1b1b;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    background:#4a6cff;
    color:white;
    cursor:pointer;
    font-size:14px;
}

button:hover{
    background:#3a55cc;
}

#frame{
    width:100%;
    height:calc(100vh - 60px);
    border:none;
}
</style>
</head>

<body>

<div id="topbar">

<button onclick="loadGame('https://poki.com')">Poki</button>
<button onclick="loadGame('https://crazygames.com')">CrazyGames</button>
<button onclick="loadGame('https://coolmathgames.com')">CoolMathGames</button>
<button onclick="loadGame('https://1v1.lol')">1v1.lol</button>
<button onclick="loadGame('https://slopegame.io')">Slope</button>
<button onclick="loadGame('https://paper-io.com')">Paper.io</button>
<button onclick="loadGame('https://shellshock.io')">Shell Shockers</button>
<button onclick="loadGame('https://krunker.io')">Krunker</button>

</div>

<iframe id="frame"></iframe>

<script>

const TOKEN = "super-secret-token";

function loadGame(url){

    const encoded = encodeURIComponent(url);

    const proxyUrl =
    "/.netlify/functions/learn?url=" +
    encoded +
    "&token=" +
    TOKEN;

    document.getElementById("frame").src = proxyUrl;
}

</script>

</body>
</html>
