<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    height:100vh;
    overflow:hidden;
}

#navbar{
    height:70px;
    background:#111827;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 20px;
    border-bottom:1px solid #1f2937;
}

#logo{
    font-size:22px;
    font-weight:bold;
    color:#60a5fa;
    white-space:nowrap;
}

#urlbar{
    flex:1;
    height:42px;
    border:none;
    outline:none;
    border-radius:12px;
    padding:0 16px;
    background:#1e293b;
    color:white;
    font-size:15px;
}

#urlbar::placeholder{
    color:#94a3b8;
}

button{
    height:42px;
    border:none;
    border-radius:12px;
    padding:0 18px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
    transition:.2s;
}

#go{
    background:#3b82f6;
    color:white;
}

#go:hover{
    background:#2563eb;
}

#home{
    background:#374151;
    color:white;
}

#home:hover{
    background:#4b5563;
}

#frame{
    width:100%;
    height:calc(100vh - 70px);
    border:none;
    background:white;
}

#loading{
    position:fixed;
    top:80px;
    right:20px;
    background:#111827;
    color:white;
    padding:10px 16px;
    border-radius:12px;
    display:none;
    z-index:9999;
    border:1px solid #1f2937;
}
</style>
</head>
<body>

<div id="navbar">
    <div id="logo">Homework</div>

    <button id="home">Home</button>

    <input
        id="urlbar"
        type="text"
        placeholder="Search or enter URL"
    >

    <button id="go">Go</button>
</div>

<div id="loading">Loading...</div>

<iframe id="frame"></iframe>

<script>
const frame = document.getElementById("frame");
const urlbar = document.getElementById("urlbar");
const loading = document.getElementById("loading");

function normalizeUrl(input){
    input = input.trim();

    if(
        !input.startsWith("http://") &&
        !input.startsWith("https://")
    ){
        if(
            input.includes(".") &&
            !input.includes(" ")
        ){
            input = "https://" + input;
        }else{
            input =
                "https://www.google.com/search?q=" +
                encodeURIComponent(input);
        }
    }

    return input;
}

function proxyUrl(url){
    return (
        location.origin +
        "/homework/proxy?url=" +
        encodeURIComponent(url)
    );
}

function go(){
    let url = normalizeUrl(urlbar.value);

    loading.style.display = "block";

    frame.src = proxyUrl(url);

    history.replaceState(
        {},
        "",
        "?url=" + encodeURIComponent(url)
    );
}

document.getElementById("go").onclick = go;

urlbar.addEventListener("keydown", e=>{
    if(e.key === "Enter"){
        go();
    }
});

document.getElementById("home").onclick = ()=>{
    frame.src = "about:blank";
    urlbar.value = "";
};

frame.onload = ()=>{
    loading.style.display = "none";
};

const params = new URLSearchParams(location.search);
const startUrl = params.get("url");

if(startUrl){
    urlbar.value = startUrl;
    frame.src = proxyUrl(startUrl);
}
</script>

</body>
</html>
