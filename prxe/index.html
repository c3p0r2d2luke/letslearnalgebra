<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PRXE Proxy</title>
</head>
<body>
  <input id="url" placeholder="https://example.com">
  <button>Go</button>

  <script src="proxy.js"></script>
  <script>
    // Register service worker with proper scope
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/prxe/sw.js", { scope: "/prxe/" });
    }

    const input = document.querySelector("#url");
    const button = document.querySelector("button");

    button.onclick = () => {
      const u = input.value;
      location.href = "/prxe/" + encodeURIComponent(u);
    };

    // Auto-load if /prxe/... URL is typed directly
    if (location.pathname.startsWith("/prxe/")) {
      const target = decodeURIComponent(location.pathname.slice(6));
      input.value = target;
      // Let service worker handle the fetch automatically
    }
  </script>
</body>
</html>
