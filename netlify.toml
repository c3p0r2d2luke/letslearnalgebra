[build]
  publish = "."

# Service worker headers
[[headers]]
for = "/prxe/sw.js"
[headers.values]
  Service-Worker-Allowed = "/prxe/"
  Cache-Control = "no-store"

# Exclude static files from the proxy function
[[redirects]]
from = "/prxe/index.html"
to = "/prxe/index.html"
status = 200
[[redirects]]
from = "/prxe/proxy.js"
to = "/prxe/proxy.js"
status = 200
[[redirects]]
from = "/prxe/sw.js"
to = "/prxe/sw.js"
status = 200

# Route all other /prxe/* URLs to the fetch function
[[redirects]]
from = "/prxe/*"
to = "/.netlify/functions/fetch?url=:splat"
status = 200
force = true