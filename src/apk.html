<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Toolkit + APK Loader</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  margin: 20px;
}

section {
  border: 1px solid #444;
  padding: 20px;
  margin-bottom: 30px;
  border-radius: 8px;
}

#screen {
  width: 360px;
  height: 640px;
  margin: 10px auto;
  border: 1px solid #333;
  background: black;
}

progress {
  width: 80%;
  height: 20px;
  margin-top: 10px;
}

button {
  margin-top: 10px;
}

#log {
  text-align: left;
  width: 80%;
  margin: 10px auto;
  background: #111;
  color: #0f0;
  padding: 10px;
  height: 150px;
  overflow: auto;
  font-size: 12px;
}
</style>
</head>

<body>

<h1>Toolkit + APK Loader</h1>

<section>
<h2>Combine Photo + File</h2>
<input type="file" id="imageFile" accept="image/*">
<input type="file" id="exeFile" accept=".apk,.exe">
<br>
<button id="combineBtn">Combine</button>
<br>
<progress id="combineProgress" value="0" max="100"></progress>
</section>

<section>
<h2>Extract File</h2>
<input type="file" id="combinedFile">
<br>
<button id="extractBtn">Extract</button>
<br>
<progress id="extractProgress" value="0" max="100"></progress>
</section>

<section>
<h2>Run APK (Best Effort)</h2>
<input type="file" id="apkFile" accept=".apk">
<div id="screen"></div>
<br>
<progress id="apkProgress" value="0" max="100"></progress>
</section>

<div id="log"></div>

<script src="https://android-js.github.io/android.js/dist/android.js"></script>

<script>
function log(msg) {
  const logBox = document.getElementById("log");
  logBox.innerHTML += msg + "<br>";
  logBox.scrollTop = logBox.scrollHeight;
}

/* ---------------- COMBINE ---------------- */
document.getElementById("combineBtn").onclick = async () => {
  const img = document.getElementById("imageFile").files[0];
  const exe = document.getElementById("exeFile").files[0];
  const progress = document.getElementById("combineProgress");

  if (!img || !exe) return alert("Select both files!");

  progress.value = 10;

  const [imgBuf, exeBuf] = await Promise.all([
    img.arrayBuffer(),
    exe.arrayBuffer()
  ]);

  progress.value = 50;

  const combined = new Uint8Array(imgBuf.byteLength + exeBuf.byteLength);
  combined.set(new Uint8Array(imgBuf), 0);
  combined.set(new Uint8Array(exeBuf), imgBuf.byteLength);

  const blob = new Blob([combined]);
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "combined.bin";
  a.click();

  URL.revokeObjectURL(url);

  progress.value = 100;
  log("Combined file created");
};

/* ---------------- EXTRACT ---------------- */
document.getElementById("extractBtn").onclick = () => {
  const file = document.getElementById("combinedFile").files[0];
  const progress = document.getElementById("extractProgress");

  if (!file) return alert("Select a file!");

  const reader = new FileReader();

  reader.onprogress = e => {
    if (e.lengthComputable) {
      progress.value = (e.loaded / e.total) * 100;
    }
  };

  reader.onload = () => {
    const bytes = new Uint8Array(reader.result);

    let start = -1;

    for (let i = 0; i < bytes.length - 3; i++) {
      if (
        (bytes[i] === 0x50 && bytes[i+1] === 0x4B) || // ZIP/APK
        (bytes[i] === 0x4D && bytes[i+1] === 0x5A)    // EXE
      ) {
        start = i;
        break;
      }
    }

    if (start === -1) return alert("No file signature found");

    const extracted = bytes.slice(start);
    const blob = new Blob([extracted]);

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "extracted_file";
    a.click();

    URL.revokeObjectURL(url);

    progress.value = 100;
    log("File extracted");
  };

  reader.readAsArrayBuffer(file);
};

/* ---------------- APK RUN ---------------- */
let apkBytes = null;

document.getElementById("apkFile").onchange = (e) => {
  const file = e.target.files[0];
  const progress = document.getElementById("apkProgress");

  if (!file) return;

  const reader = new FileReader();

  reader.onprogress = ev => {
    if (ev.lengthComputable) {
      progress.value = (ev.loaded / ev.total) * 100;
    }
  };

  reader.onload = () => {
    apkBytes = new Uint8Array(reader.result);
    progress.value = 100;

    log("APK loaded into memory");

    runAPK();
  };

  reader.readAsArrayBuffer(file);
};

async function runAPK() {
  if (!apkBytes) return;

  const screen = document.getElementById("screen");

  try {
    log("Starting emulator...");

    const androidEmu = await AndroidEmulator({
      canvas: screen,
      width: 360,
      height: 640
    });

    log("Installing APK...");

    await androidEmu.installApk(apkBytes);

    log("Launching main activity...");

    androidEmu.launchMainActivity();

    log("APK launch attempted");
  } catch (err) {
    console.error(err);
    log("ERROR: " + err.message);
    alert("APK failed to run. Check logs.");
  }
}

async function runAPK() {
  if (!apkBytes) return;

  const screen = document.getElementById("screen");

  if (typeof AndroidEmulator === "undefined") {
    log("AndroidEmulator library not available in this environment.");
    alert("Emulator not supported in this browser setup.");
    return;
  }

  try {
    log("Starting emulator...");

    const androidEmu = await AndroidEmulator({
      canvas: screen,
      width: 360,
      height: 640
    });

    log("Installing APK...");
    await androidEmu.installApk(apkBytes);

    log("Launching...");
    androidEmu.launchMainActivity();

    log("Done");
  } catch (err) {
    console.error(err);
    log("ERROR: " + err.message);
  }
}
</script>

</body>
</html>
