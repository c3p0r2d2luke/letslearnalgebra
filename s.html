<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Proxy Browser</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; }
    #bar {
      padding: 10px;
      background: #eee;
      display: flex;
      gap: 10px;
    }
    #url {
      flex: 1;
      padding: 8px;
      font-size: 16px;
    }
    iframe {
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
    }
  </style>
</head>
<body>

  <div id="bar">
    <input id="url" type="text" placeholder="Enter URL…" />
    <button id="go">Go</button>
  </div>

  <iframe id="frame"></iframe>

  <script>
    const PROXY = "https://letslearnalgebra.netlify.app/proxy";

    async function load(url) {
      document.getElementById("url").value = url;

      const res = await fetch(PROXY, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pageURL: url })
      });

      const html = await res.text();

      const frame = document.getElementById("frame");
      const doc = frame.contentDocument || frame.contentWindow.document;
      doc.open();
      doc.write(html);
      doc.close();
    }

    document.getElementById("go").onclick = () => {
      const url = document.getElementById("url").value;
      load(url);
    };

    // Listen for navigation events from inside the iframe
    window.addEventListener("message", (event) => {
      if (event.data && event.data.proxiedURL) {
        document.getElementById("url").value = event.data.proxiedURL;
      }
    });
  </script>

</body>
</html>
