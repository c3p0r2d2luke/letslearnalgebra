<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Proxy Renderer</title>
  <style>
    iframe {
      width: 100%;
      height: 90vh;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>
  <h1>Proxy Renderer</h1>

  <button id="run">Load via Proxy</button>

  <iframe id="frame"></iframe>

  <script>
    const PROXY = "https://letslearnalgebra.netlify.app/proxy";

    document.getElementById("run").onclick = async () => {
      const res = await fetch(PROXY, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pageURL: "https://httpbin.org/html" })
      });

      const html = await res.text();

      // Render inside iframe
      const frame = document.getElementById("frame");
      const doc = frame.contentDocument || frame.contentWindow.document;
      doc.open();
      doc.write(html);
      doc.close();
    };
  </script>
</body>
</html>
