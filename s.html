<!DOCTYPE html>
<html>
<body>
  <button id="run">Test Proxy</button>
  <pre id="out"></pre>

  <script>
    const PROXY = "https://letslearnalgebra.netlify.app/proxy";

    document.getElementById("run").onclick = async () => {
      const res = await fetch(PROXY, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pageURL: "https://httpbin.org/html" })
      });

      document.getElementById("out").textContent = await res.text();
    };
  </script>
</body>
</html>
